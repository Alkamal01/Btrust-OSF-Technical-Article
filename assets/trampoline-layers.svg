<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Outer and inner layers of a trampoline payment</title>
  <desc id="desc">A sender routes an outer payment to a trampoline node. The trampoline unwraps an inner payment and routes it to the final receiver.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 23px Arial, sans-serif; fill: #172033; }
      .small { font: 18px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">A trampoline payment contains two routing problems</text>

  <circle cx="120" cy="300" r="44" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <circle cx="600" cy="300" r="58" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  <circle cx="1080" cy="300" r="44" fill="#dcfce7" stroke="#059669" stroke-width="3"/>
  <text x="120" y="308" text-anchor="middle" class="label">Alice</text>
  <text x="600" y="308" text-anchor="middle" class="label">T</text>
  <text x="1080" y="308" text-anchor="middle" class="label">Bob</text>
  <text x="600" y="400" text-anchor="middle" class="small">Trampoline node</text>

  <line x1="170" y1="300" x2="530" y2="300" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="670" y1="300" x2="1030" y2="300" stroke="#059669" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="350" y="245" text-anchor="middle" class="label">Outer payment</text>
  <text x="350" y="275" text-anchor="middle" class="small">HTLC + outer onion</text>
  <text x="850" y="245" text-anchor="middle" class="label">Inner payment</text>
  <text x="850" y="275" text-anchor="middle" class="small">HTLC + inner onion</text>

  <rect x="490" y="470" width="220" height="76" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
  <text x="600" y="500" text-anchor="middle" class="small">unwrap outer layer</text>
  <text x="600" y="526" text-anchor="middle" class="small">then route inner layer</text>
  <line x1="600" y1="358" x2="600" y2="465" stroke="#d97706" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
</svg>
