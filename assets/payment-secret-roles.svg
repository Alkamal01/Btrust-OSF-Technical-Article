<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Payment hash, payment secret, and preimage have different roles</title>
  <desc id="desc">The preimage hashes to the payment hash. The payment secret identifies the intended invoice. The receiver checks both before revealing the preimage.</desc>
  <defs><style>.title{font:700 30px Arial;fill:#0f172a}.label{font:700 22px Arial;fill:#172033}.small{font:18px Arial;fill:#475569}.code{font:600 21px monospace;fill:#7c3aed}</style></defs>
  <rect width="1200" height="560" rx="24" fill="#f8fafc"/><text x="60" y="58" class="title">Three values, three different jobs</text>
  <rect x="80" y="150" width="280" height="150" rx="18" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/><text x="220" y="195" text-anchor="middle" class="label">Preimage R</text><text x="220" y="245" text-anchor="middle" class="small">revealed to settle</text>
  <rect x="460" y="150" width="280" height="150" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="600" y="195" text-anchor="middle" class="label">Payment hash H</text><text x="600" y="245" text-anchor="middle" class="small">commits to R</text>
  <rect x="840" y="150" width="280" height="150" rx="18" fill="#dcfce7" stroke="#059669" stroke-width="3"/><text x="980" y="195" text-anchor="middle" class="label">Payment secret S</text><text x="980" y="245" text-anchor="middle" class="small">identifies the invoice</text>
  <text x="410" y="220" text-anchor="middle" class="code">SHA256(R) → H</text><text x="600" y="400" text-anchor="middle" class="small">The receiver checks H and S before revealing R.</text>
</svg>
