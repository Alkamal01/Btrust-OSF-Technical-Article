<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">HTLC payment setup and settlement</title>
  <desc id="desc">Alice, Carol, Dave, and Bob are connected by HTLCs using the same payment hash. Bob reveals the preimage, which settles the route backwards.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <style>
      .label { font: 600 24px Arial, sans-serif; fill: #172033; }
      .small { font: 18px Arial, sans-serif; fill: #475569; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">One condition connects every hop</text>

  <circle cx="130" cy="170" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <circle cx="410" cy="170" r="42" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
  <circle cx="690" cy="170" r="42" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
  <circle cx="970" cy="170" r="42" fill="#dcfce7" stroke="#059669" stroke-width="3"/>
  <text x="130" y="178" text-anchor="middle" class="label">Alice</text>
  <text x="410" y="178" text-anchor="middle" class="label">Carol</text>
  <text x="690" y="178" text-anchor="middle" class="label">Dave</text>
  <text x="970" y="178" text-anchor="middle" class="label">Bob</text>

  <line x1="175" y1="170" x2="365" y2="170" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <line x1="455" y1="170" x2="645" y2="170" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <line x1="735" y1="170" x2="925" y2="170" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="270" y="142" text-anchor="middle" class="small">HTLC(H)</text>
  <text x="550" y="142" text-anchor="middle" class="small">HTLC(H)</text>
  <text x="830" y="142" text-anchor="middle" class="small">HTLC(H)</text>
  <text x="600" y="245" text-anchor="middle" class="small">Payment setup: each hop is conditional on the same hash H</text>

  <line x1="925" y1="370" x2="735" y2="370" stroke="#059669" stroke-width="5" marker-end="url(#arrow-green)"/>
  <line x1="645" y1="370" x2="455" y2="370" stroke="#059669" stroke-width="5" marker-end="url(#arrow-green)"/>
  <line x1="365" y1="370" x2="175" y2="370" stroke="#059669" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="830" y="342" text-anchor="middle" class="small">R revealed</text>
  <text x="550" y="342" text-anchor="middle" class="small">R revealed</text>
  <text x="270" y="342" text-anchor="middle" class="small">R revealed</text>
  <text x="600" y="445" text-anchor="middle" class="small">Settlement moves backwards after Bob reveals the preimage R</text>
</svg>
